spring.application.name=health-activity-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/health_activity?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:health_activity}
spring.datasource.password=${DB_PASSWORD:local-password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# UTC로 변환한 LocalDateTime을 JDBC에 직접 전달하여 JVM 시간대의 이중 변환을 방지한다.
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
spring.mvc.problemdetails.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
