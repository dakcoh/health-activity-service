services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: health_activity
      MYSQL_USER: health_activity
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
